[package]
name = "deepseek-harness-launcher"
version = "0.2.0"
description = "托盘常驻启动器：安装 / 启动 DeepSeek Harness 及依赖，并提供加速与网址菜单"
authors = [ "deepseek-harness-launcher contributors" ]
edition = "2021"
default-run = "deepseek-harness-launcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "image-png", "test" ] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sha2 = "0.10"
log = { version = "0.4", features = [ "alloc" ] }
reqwest = { version = "0.12", features = [ "json", "stream" ] }
futures-util = "0.3"
zip = "0.6"
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = [ "rt-multi-thread", "time", "net", "io-util" ] }
dirs = "5"
once_cell = "1"
chrono = "0.4"
semver = "1"
url = "2"
tiny_http = "0.12.0"
arboard = "3.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Threading",
  "Win32_System_Time",
] }

# 本机编译内存受限：`windows`/`syn` 等巨型 crate 冷编译会内存耗尽。
# 通过共享现有桌面端 `target` 目录复用已编译产物（见 `.cargo/config.toml`）。
# 桌面端 `deepseek-harness-desktop` 未配置任何 `[profile]`（即 cargo 默认 dev profile：
# opt-level 0、incremental 默认关闭）。这里同样不写 `[profile.dev]`，保持与桌面端
# 完全一致的 profile 指纹，使 `windows`/`webview2-com-sys` 等巨型 crate 的已编译产物
# 可被直接复用。若在其它机器上构建，删除 `.cargo/config.toml` 即可使用独立 target。
