name: Release

# 打 tag（如 v0.1.0）时自动构建并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            client_artifact: deepseek-harness-launcher-client-windows-x64.zip
            server_artifact: deepseek-harness-launcher-server.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # Rust 工具链（edition 2021，稳定版）
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 缓存 cargo 依赖（加速重复构建）
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # Windows 构建需要 WebView2（runner 自带）+ MSVC 链接器（windows-latest 自带）
      - name: Build (release)
        shell: bash
        run: |
          # tauri-build 读 tauri.conf.json 的 frontendDist（../dist），无窗口应用
          # 不需要前端产物，但目录必须存在（避免构建告警/失败）
          mkdir -p dist
          cargo build --release --manifest-path src-tauri/Cargo.toml
        env:
          RUST_BACKTRACE: 1

      # 组装发布产物：拆分为客户端包 + 服务端包（各放所需文件）
      - name: Package artifacts
        shell: pwsh
        run: |
          # ── 客户端包：主程序 + 品牌插件 + 配置示例 + 使用说明 ──
          New-Item -ItemType Directory -Force -Path dist/client/launcher-brand | Out-Null
          Copy-Item src-tauri/target/release/deepseek-harness-launcher.exe dist/client/
          Copy-Item launcher-brand/* dist/client/launcher-brand/ -Recurse -Force
          Copy-Item launcher-config.json.example dist/client/
          Copy-Item client-README.md dist/client/README.md
          Compress-Archive -Path dist/client -DestinationPath ${{ matrix.client_artifact }} -Force

          # ── 服务端包：中心服务端 + 管理页 JS + 部署文档 ──
          New-Item -ItemType Directory -Force -Path dist/server | Out-Null
          Copy-Item server/server.js, server/admin.js, server/package.json dist/server/
          Copy-Item server/README.md dist/server/README.md
          Copy-Item server/INTEGRATION-CADDY.md dist/server/
          Compress-Archive -Path dist/server -DestinationPath ${{ matrix.server_artifact }} -Force

          Get-Item ${{ matrix.client_artifact }}, ${{ matrix.server_artifact }} | Select-Object Name, Length

      # 发布 GitHub Release（客户端包 + 服务端包）
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.client_artifact }}
            ${{ matrix.server_artifact }}
          generate_release_notes: true
          name: DeepSeek Harness Launcher ${{ github.ref_name }}
